# Reusable workflow. A project calls this from its own one-file workflow;
# see templates/ for the file to copy.
#
# Three jobs. "gate" is plain CI with no model in it and is what a required
# status check is made of. "review" runs the action after the gate, in both
# directions: a green gate gets a review, a red gate gets a diagnosis.
# "canary" runs the gate's steps on the next runner image and decides nothing.

name: pr-verify

on:
  workflow_call:
    inputs:
      runtime:
        description: node, python or go
        required: true
        type: string
      runtime-version:
        description: Version passed to the matching setup action
        required: true
        type: string
      install-command:
        required: true
        type: string
      build-command:
        required: true
        type: string
      test-command:
        required: true
        type: string
      lint:
        description: Run a linter in the gate
        required: false
        type: boolean
        default: true
      lint-command:
        description: >-
          Replaces the default linter, which is ruff for python, go vet for go,
          and for node the project's own lint script or else Biome.
        required: false
        type: string
        default: ''
      security-scan:
        description: >-
          strict fails on anything Trivy or Semgrep finds; loose fails only on
          Trivy's HIGH and CRITICAL and Semgrep's ERROR.
        required: false
        type: string
        default: strict
      audit-command:
        description: Dependency vulnerability scan. Leave empty to skip the audit step.
        required: false
        type: string
        default: ''
      review:
        description: Run the Claude review after the gate
        required: false
        type: boolean
        default: true
      model:
        required: false
        type: string
        default: claude-sonnet-5-5
      guidance-file:
        required: false
        type: string
        default: REVIEW.md
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  gate:
    name: gate
    # Pinned, so the required check changes only when the code does. The
    # canary runs the same steps on the image ubuntu-latest points at next.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps: &gate-steps
      # No token left in .git/config for the project's code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: inputs.runtime == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.runtime-version }}
          cache: npm

      - name: Set up Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.runtime-version }}
          cache: pip

      - name: Set up Go
        if: inputs.runtime == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.runtime-version }}

      - name: install
        run: ${{ inputs.install-command }}

      - name: lint
        if: inputs.lint && inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      # Defaults that need no config in the project. Versions are pinned so
      # a linter release cannot turn the gate red on its own.
      - name: lint
        if: inputs.lint && inputs.lint-command == ''
        env:
          RUNTIME: ${{ inputs.runtime }}
        run: |
          case "$RUNTIME" in
            python) pipx run ruff==0.17.2 check . ;;
            go) go vet ./... ;;
            node)
              if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
                npm run lint
              else
                npx --yes @biomejs/biome@2.6.3 lint --vcs-enabled=true --vcs-client-kind=git --vcs-use-ignore-file=true .
              fi ;;
          esac

      # Lint finds smells; this follows untrusted input to a dangerous call.
      # Semgrep 1.182.0, pinned by image digest so its content cannot change.
      # The rule packs are fetched from Semgrep's registry when it runs, since
      # their license does not allow shipping copies of them.
      - name: static analysis
        env:
          MODE: ${{ inputs.security-scan }}
          RUNTIME: ${{ inputs.runtime }}
        run: |
          case "$RUNTIME" in
            python) packs="--config p/python" ;;
            go) packs="--config p/golang" ;;
            node) packs="--config p/javascript --config p/typescript" ;;
          esac
          case "$MODE" in
            strict) severity= ;;
            loose) severity="--severity ERROR" ;;
            *) echo "security-scan must be strict or loose, not '$MODE'" >&2; exit 1 ;;
          esac
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af \
            semgrep scan $packs $severity --error --metrics off --disable-version-check

      - name: build
        run: ${{ inputs.build-command }}

      - name: test
        run: ${{ inputs.test-command }}

      - name: audit
        if: inputs.audit-command != ''
        run: ${{ inputs.audit-command }}

      # Installed from a pinned, immutable release and checked against its
      # hash rather than through trivy-action, whose tags were rewritten to
      # steal CI secrets in March 2026.
      - name: install security scanner
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy

      # node_modules is skipped because the lockfile already lists everything in it.
      - name: security scan
        env:
          MODE: ${{ inputs.security-scan }}
        run: |
          case "$MODE" in
            strict) severity=UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL ;;
            loose) severity=HIGH,CRITICAL ;;
            *) echo "security-scan must be strict or loose, not '$MODE'" >&2; exit 1 ;;
          esac
          "$RUNNER_TEMP/trivy" fs --scanners vuln,secret,misconfig --severity "$severity" \
            --exit-code 1 --no-progress --skip-dirs node_modules .

  # Not a required check, and nothing needs it: a red canary never blocks a
  # merge or starts an investigation. It says the pin is not safe to move yet.
  canary:
    name: 'canary: ubuntu-latest (non-blocking)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps: *gate-steps

  review:
    name: review
    needs: gate
    # The condition starts with a status-check function on purpose. GitHub
    # silently prepends success() to any job condition that lacks one, and
    # that is false once the gate has failed, which would stop the red-gate
    # branch from ever running.
    if: >-
      !cancelled()
      && inputs.review
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the action diffs against the merge base and against
          # the commits earlier findings were posted on.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # The suite runs in this checkout; it must not find a token in .git/config.
          persist-credentials: false

      - name: Set up Node
        if: inputs.runtime == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.runtime-version }}
          cache: npm

      - name: Set up Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.runtime-version }}
          cache: pip

      - name: Set up Go
        if: inputs.runtime == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.runtime-version }}

      - name: install
        run: ${{ inputs.install-command }}

      - name: PR Verify
        uses: chight1/pr-verify@v1
        with:
          gate-result: ${{ needs.gate.result }}
          gate-job-name: gate
          build-command: ${{ inputs.build-command }}
          test-command: ${{ inputs.test-command }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
          guidance-file: ${{ inputs.guidance-file }}
