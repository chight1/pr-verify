# Reusable workflow. A project calls this from its own one-file workflow;
# see templates/ for the file to copy.
#
# Two jobs. "gate" is plain CI with no model in it and is what a required
# status check is made of. "review" runs the action after the gate, in both
# directions: a green gate gets a review, a red gate gets a diagnosis.

name: pr-verify

on:
  workflow_call:
    inputs:
      runtime:
        description: node, python or go
        required: true
        type: string
      runtime-version:
        description: Version passed to the matching setup action
        required: true
        type: string
      install-command:
        required: true
        type: string
      build-command:
        required: true
        type: string
      test-command:
        required: true
        type: string
      audit-command:
        description: Dependency vulnerability scan. Leave empty to skip the audit step.
        required: false
        type: string
        default: ''
      review:
        description: Run the Claude review after the gate
        required: false
        type: boolean
        default: true
      model:
        required: false
        type: string
        default: claude-sonnet-5-5
      guidance-file:
        required: false
        type: string
        default: REVIEW.md
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        if: inputs.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.runtime-version }}
          cache: npm

      - name: Set up Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.runtime-version }}
          cache: pip

      - name: Set up Go
        if: inputs.runtime == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.runtime-version }}

      - name: install
        run: ${{ inputs.install-command }}

      - name: build
        run: ${{ inputs.build-command }}

      - name: test
        run: ${{ inputs.test-command }}

      - name: audit
        if: inputs.audit-command != ''
        run: ${{ inputs.audit-command }}

  review:
    name: review
    needs: gate
    # The condition starts with a status-check function on purpose. GitHub
    # silently prepends success() to any job condition that lacks one, and
    # that is false once the gate has failed, which would stop the red-gate
    # branch from ever running.
    if: >-
      !cancelled()
      && inputs.review
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the action diffs against the merge base and against
          # the commits earlier findings were posted on.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        if: inputs.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.runtime-version }}
          cache: npm

      - name: Set up Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.runtime-version }}
          cache: pip

      - name: Set up Go
        if: inputs.runtime == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.runtime-version }}

      - name: install
        run: ${{ inputs.install-command }}

      - name: PR Verify
        uses: chight1/pr-verify@v1
        with:
          gate-result: ${{ needs.gate.result }}
          gate-job-name: gate
          build-command: ${{ inputs.build-command }}
          test-command: ${{ inputs.test-command }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
          guidance-file: ${{ inputs.guidance-file }}
