# CI for PR Verify itself: tests, type check, and a guard that dist/ matches src/.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          # The sandbox tests check this never reaches a sandboxed command.
          PR_VERIFY_CANARY: canary-${{ github.run_id }}
      - run: npm run build
      - name: dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is stale. Run 'npm run build' and commit the result." >&2
            git status --porcelain dist >&2
            git diff --stat dist >&2
            git diff dist | head -80 >&2
            exit 1
          fi
