# CI for PR Verify itself: its own gate and review, from this commit's copy of
# the workflow, and a check that dist/ matches src/. The review runs the
# released action, so a PR cannot change the reviewer that judges it.
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  pr-verify:
    uses: ./.github/workflows/pr-verify.yml
    with:
      runtime: node
      runtime-version: "24"
      install-command: npm ci
      # The build compiles only src/, so the tests are type-checked first.
      build-command: npm run typecheck && npm run build
      # The sandbox tests check this never reaches a sandboxed command.
      test-command: PR_VERIFY_CANARY="canary-$GITHUB_RUN_ID" npm test
      audit-command: npm audit --audit-level=high
    secrets: inherit

  dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is stale. Run 'npm run build' and commit the result." >&2
            git status --porcelain dist >&2
            git diff --stat dist >&2
            git diff dist | head -80 >&2
            exit 1
          fi

  # The code-quality checks from this commit, on this commit and on a scratch
  # project built to fail them.
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./checks
      - name: checks test
        if: ${{ !cancelled() }}
        run: bash checks/test.sh
