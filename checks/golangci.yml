# The gate's Go lint rules. gofmt runs as the formatting check.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - mnd
    - nestif
    - nilerr
    - revive
    - staticcheck
    - unused
  settings:
    # The size and complexity limits, the same in every language.
    funlen:
      lines: 50
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 10
    nestif:
      min-complexity: 4
    revive:
      enable-default-rules: true
      rules:
        - name: argument-limit
          arguments: [5]
    forbidigo:
      # Debug output left in. A command writes through a logger or its own writer.
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
    gocritic:
      enabled-checks:
        - commentedOutCode
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
