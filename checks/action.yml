name: PR Verify checks
description: >-
  The gate's code-quality checks, with settings that ship with PR Verify rather
  than the project's own.
inputs:
  scope:
    description: repository checks every file; changes checks only the code the pull request changes
    required: false
    default: repository
runs:
  using: composite
  steps:
    # From this directory's lockfile, without install scripts.
    - name: install check tools
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --ignore-scripts --no-audit --no-fund
    - name: code quality
      shell: bash
      env:
        GATE_SCOPE: ${{ inputs.scope }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
