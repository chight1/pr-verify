# Copy to .github/workflows/pr-verify.yml in a Go project.
name: pr-verify

on:
  pull_request:
  # The weekly canary: the gate alone, on the runner image the pin moves to next.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-verify:
    uses: chight1/pr-verify/.github/workflows/pr-verify.yml@v2
    permissions:
      contents: read
      pull-requests: write
      actions: read
    with:
      runtime: go
      runtime-version: "1.23"
      install-command: go mod download
      build-command: go build ./... && go vet ./...
      test-command: go test ./...
      audit-command: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
